      documentação e testes. TypeScript, Vue e Astro fazem parte do meu dia a
      dia, e trato performance, acessibilidade e SEO como requisitos desde o
      início, não como etapa final.
    - >-
      Gosto de revisar código e de ajudar outras pessoas a crescer. Ao longo
      da carreira, acompanhei dezenas de desenvolvedores front-end com
      mentoria e code review.
