  role: Desenvolvedor Front-end Sênior
  tagline: >-
    Arquitetura Front-end e Design Systems para produtos de alta audiência,
    com mais de 18 anos construindo para a web.
  availability: Aberto a oportunidades remotas ou híbridas em São Paulo
  location: São Paulo, SP
  about:
    - >-
      Construo interfaces que precisam aguentar escala: muita gente acessando
      ao mesmo tempo, componentes reutilizados por diferentes times e anos de
      evolução sem virar dívida técnica.
    - >-
      Meu foco é criar a base que deixa outros desenvolvedores mais rápidos e
